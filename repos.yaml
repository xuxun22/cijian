# cijian · 代码仓清单
# scripts/bootstrap-repos.sh 依据本文件自动建仓并推送骨架。
# 格式固定（脚本逐行解析，字段顺序不可变）：
#   - name / visibility / description / source
# source = 业务代码暂存目录（相对本仓根，bootstrap 时并入该仓；留空 "" 表示暂无）。

owner: xuxun22

repos:
