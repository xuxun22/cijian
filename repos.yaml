    visibility: private
    description: 此间站点（Astro）—— 公开内容 + 登录后打印工作台，部署于 Vercel
    source: ../cijian-site

  - name: cijian-api
    visibility: private
    description: 此间后端（Node 22 + Hono + SQLite）—— 鉴权、文件、打印任务调度
    source: ""

  - name: cijian-agent
    visibility: private
    description: 此间任务守护进程（Python）—— 拉取任务并执行（打印），纯出站
    source: ""
